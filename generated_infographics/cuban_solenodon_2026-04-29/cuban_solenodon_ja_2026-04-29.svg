    <path d="M840 640 C910 590 992 560 1095 555" stroke="#41633f" stroke-width="12" fill="none"/>
  </g>

  <g>
    <rect x="105" y="310" width="430" height="138" rx="16" class="label"/>
    <text x="135" y="365" class="jp note">キューバ東部の山地林で</text>
    <text x="135" y="413" class="jp note">夜に動く</text>
    <rect x="690" y="330" width="405" height="142" rx="16" class="label"/>
    <text x="720" y="388" class="jp note">長い鼻で落ち葉と</text>
    <text x="720" y="436" class="jp note">土をさぐる</text>
    <rect x="125" y="1085" width="485" height="150" rx="16" class="label"/>
    <text x="155" y="1145" class="jp note">溝のある下の切歯と</text>
    <text x="155" y="1195" class="jp note">毒性の唾液</text>
  </g>

  <rect x="72" y="1310" width="1056" height="95" rx="18" fill="#efe4c8" stroke="#846a49" stroke-width="4"/>
  <text x="105" y="1368" class="jp footer">IUCN Red List: Endangered (EN)  個体数はよく分かっていません</text>
</svg>
