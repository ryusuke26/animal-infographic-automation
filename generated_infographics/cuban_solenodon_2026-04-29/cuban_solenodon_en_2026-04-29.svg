<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">The Almiqui Reads the Forest</title>
  <desc id="desc">A field-notebook style infographic about the Cuban solenodon.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="9" result="noise"/>
      <feColorMatrix type="saturate" values="0.25"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <filter id="crayon" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="13" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="2.8"/>
    </filter>
    <style>
      .sans { font-family: "Trebuchet MS", "Arial", sans-serif; fill: #2f2922; }
      .latin { font-family: Georgia, "Times New Roman", serif; fill: #3b3028; }
      .note { font-size: 36px; font-weight: 700; }
      .small { font-size: 30px; }
      .footer { font-size: 28px; }
      .label { fill: #fff8e9; stroke: #5c6f4b; stroke-width: 5; }
      .sketch { stroke-linecap: round; stroke-linejoin: round; filter: url(#crayon); }
    </style>
  </defs>
  <rect width="1200" height="1500" fill="#f4e6c9" filter="url(#paper)"/>
  <path d="M0 1180 C180 1110 260 1220 430 1160 C590 1105 700 1195 890 1140 C1035 1098 1120 1140 1200 1115 L1200 1500 L0 1500 Z" fill="#d7c18e" opacity="0.45"/>
  <path d="M60 1010 C180 930 310 1010 420 950 C535 890 655 955 745 915 C875 858 1010 928 1140 850" fill="none" stroke="#6c7d4e" stroke-width="18" opacity="0.28" class="sketch"/>
  <circle cx="1000" cy="250" r="86" fill="#c7d6df" opacity="0.65"/>
  <text x="90" y="135" class="sans" font-size="66" font-weight="800">The Almiqui Reads</text>
  <text x="90" y="205" class="sans" font-size="66" font-weight="800">the Forest</text>
  <text x="94" y="264" class="latin" font-size="38" font-style="italic">Atopogale cubana</text>
  <text x="94" y="308" class="sans small">Cuban solenodon</text>

  <g class="sketch">
    <ellipse cx="610" cy="765" rx="310" ry="160" fill="#7b4d34" stroke="#4a2e23" stroke-width="10"/>
    <ellipse cx="455" cy="712" rx="132" ry="92" fill="#835238" stroke="#4a2e23" stroke-width="9"/>
    <path d="M352 705 C260 683 205 707 162 755 C235 772 307 769 376 740 Z" fill="#8d5a3a" stroke="#4a2e23" stroke-width="9"/>
    <path d="M160 755 C119 767 91 793 78 822" fill="none" stroke="#4a2e23" stroke-width="7"/>
    <path d="M165 762 C116 758 84 766 52 785" fill="none" stroke="#4a2e23" stroke-width="5"/>
    <path d="M180 740 C133 720 98 718 62 725" fill="none" stroke="#4a2e23" stroke-width="5"/>
    <circle cx="430" cy="685" r="12" fill="#171413"/>
    <path d="M410 642 C393 608 405 582 432 572 C455 601 454 631 433 655 Z" fill="#71432f" stroke="#4a2e23" stroke-width="7"/>
    <path d="M875 804 C1015 825 1102 892 1135 970" fill="none" stroke="#5c3d2e" stroke-width="18"/>
    <path d="M520 885 C495 940 462 975 420 1000" fill="none" stroke="#4a2e23" stroke-width="14"/>
    <path d="M690 892 C675 950 646 990 600 1020" fill="none" stroke="#4a2e23" stroke-width="14"/>
    <path d="M410 1005 L365 1030 M418 1002 L388 1045 M596 1020 L552 1042 M605 1018 L575 1060" stroke="#4a2e23" stroke-width="7"/>
    <path d="M310 825 C255 855 210 892 176 940" stroke="#41633f" stroke-width="12" fill="none"/>
    <path d="M840 660 C910 610 992 580 1095 575" stroke="#41633f" stroke-width="12" fill="none"/>
  </g>

  <g>
    <rect x="95" y="365" width="455" height="140" rx="16" class="label"/>
    <text x="125" y="421" class="sans note">Night-active in eastern</text>
    <text x="125" y="469" class="sans note">Cuba's mountain forests</text>
    <rect x="682" y="370" width="420" height="142" rx="16" class="label"/>
    <text x="712" y="428" class="sans note">Long snout probes</text>
    <text x="712" y="476" class="sans note">leaves and soil</text>
    <rect x="125" y="1090" width="545" height="150" rx="16" class="label"/>
    <text x="155" y="1150" class="sans note">Grooved lower incisors</text>
    <text x="155" y="1198" class="sans note">carry toxic saliva</text>
  </g>

  <rect x="72" y="1310" width="1056" height="95" rx="18" fill="#efe4c8" stroke="#846a49" stroke-width="4"/>
  <text x="105" y="1368" class="sans footer">IUCN Red List: Endangered (EN). No reliable public total is used here.</text>
</svg>
