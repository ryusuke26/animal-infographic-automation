<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f5ead5"/>
  <rect x="54" y="54" width="972" height="1242" rx="28" fill="#fff8e8" stroke="#5b4a36" stroke-width="6"/>
  <text x="95" y="140" font-family="Yu Gothic, Meiryo, sans-serif" font-size="54" font-weight="700" fill="#2f2923">溝のある歯をもつ、夜の探り屋。</text>
  <text x="95" y="205" font-family="Arial, sans-serif" font-size="38" fill="#5b4a36">Hispaniolan Solenodon</text>
  <text x="95" y="252" font-family="Arial, sans-serif" font-size="32" font-style="italic" fill="#5b4a36">Solenodon paradoxus</text>
  <ellipse cx="555" cy="580" rx="300" ry="155" fill="#7a563b" stroke="#3f2e22" stroke-width="7"/>
  <circle cx="795" cy="520" r="82" fill="#7a563b" stroke="#3f2e22" stroke-width="7"/>
  <path d="M845 530 C930 505 970 520 998 545" fill="none" stroke="#c9957d" stroke-width="22" stroke-linecap="round"/>
  <circle cx="817" cy="495" r="9" fill="#17130f"/>
  <path d="M315 675 C245 730 190 730 135 690" fill="none" stroke="#80614d" stroke-width="20" stroke-linecap="round"/>
  <path d="M375 710 l-55 70 M515 724 l-45 78 M665 710 l52 70" stroke="#3f2e22" stroke-width="13" stroke-linecap="round"/>
  <path d="M190 875 C310 810 395 810 500 868" fill="none" stroke="#d4a94d" stroke-width="6" stroke-dasharray="10 16"/>
  <text x="120" y="900" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" fill="#2f2923">イスパニョーラ島の夜</text>
  <text x="120" y="972" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" fill="#2f2923">長い鼻で土や落ち葉を探る</text>
  <text x="120" y="1044" font-family="Yu Gothic, Meiryo, sans-serif" font-size="38" fill="#2f2923">下あごの歯には、毒と関係する細い溝</text>
  <text x="120" y="1145" font-family="Yu Gothic, Meiryo, sans-serif" font-size="40" font-weight="700" fill="#2f2923">夜の地面を鼻でたどる、ちょっと不思議な暮らし。</text>
  <text x="120" y="1240" font-family="Arial, sans-serif" font-size="28" fill="#5b4a36">IUCN Red List 2020: Least Concern (LC)</text>
</svg>

