  <text x="120" y="900" font-family="Arial, sans-serif" font-size="38" fill="#2f2923">Hispaniola nights</text>
  <text x="120" y="972" font-family="Arial, sans-serif" font-size="38" fill="#2f2923">Long snout in soil and leaf litter</text>
  <text x="120" y="1044" font-family="Arial, sans-serif" font-size="38" fill="#2f2923">Grooved lower incisor linked to venom</text>
