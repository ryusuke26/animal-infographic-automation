<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">ほし形の鼻でさぐる</title>
  <desc id="desc">ホシバナモグラの日本語教育インフォグラフィック</desc>
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.10"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <filter id="crayon">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="12"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <style>
      .jp { font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans CJK JP", sans-serif; }
      .latin { font-family: "Segoe UI", "Arial", sans-serif; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; filter: url(#crayon); }
      .note { fill: #fff8df; stroke: #394c3b; stroke-width: 4; rx: 18; }
    </style>
  </defs>
  <rect width="1200" height="1500" fill="#f3e7c7"/>
  <rect width="1200" height="1500" fill="#f3e7c7" filter="url(#paper)"/>
  <path d="M0 1040 C170 980 250 1090 390 1030 C520 970 680 980 840 1035 C990 1085 1060 990 1200 1040 L1200 1500 L0 1500 Z" fill="#b9c9a4" opacity="0.85"/>
  <path d="M0 1180 C180 1120 310 1210 475 1165 C650 1118 790 1180 975 1150 C1070 1135 1130 1150 1200 1185 L1200 1500 L0 1500 Z" fill="#84a987" opacity="0.75"/>
