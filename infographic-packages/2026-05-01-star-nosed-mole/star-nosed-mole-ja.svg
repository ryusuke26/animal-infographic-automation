  <text x="80" y="135" class="jp" font-size="74" font-weight="800" fill="#263225">ほし形の鼻でさぐる</text>
  <text x="84" y="198" class="latin" font-size="34" font-style="italic" fill="#4d5948">ホシバナモグラ / Condylura cristata</text>

  <ellipse cx="610" cy="690" rx="310" ry="188" fill="#2d2825" opacity="0.98" filter="url(#crayon)"/>
  <ellipse cx="840" cy="700" rx="112" ry="86" fill="#2c2824" filter="url(#crayon)"/>
  <path class="line" d="M355 710 C265 735 210 800 165 875" stroke="#2a2923" stroke-width="48"/>
  <path class="line" d="M455 805 C375 865 335 935 310 1010" stroke="#2a2923" stroke-width="42"/>
  <path class="line" d="M840 742 C938 805 1010 895 1045 1015" stroke="#3b2d25" stroke-width="30"/>
  <circle cx="875" cy="663" r="8" fill="#111"/>
  <path class="line" d="M885 705 C940 685 985 666 1035 641" stroke="#ee8ba4" stroke-width="22"/>
  <path class="line" d="M885 705 C942 710 990 710 1048 710" stroke="#ee8ba4" stroke-width="22"/>
  <path class="line" d="M885 705 C940 735 980 762 1028 795" stroke="#ee8ba4" stroke-width="22"/>
  <path class="line" d="M888 700 C927 655 952 626 982 584" stroke="#ee8ba4" stroke-width="18"/>
  <path class="line" d="M890 708 C922 760 944 800 964 850" stroke="#ee8ba4" stroke-width="18"/>
  <circle cx="887" cy="704" r="30" fill="#e86f91" filter="url(#crayon)"/>
  <path class="line" d="M395 820 C345 870 315 900 250 930" stroke="#20221e" stroke-width="30"/>
  <path class="line" d="M425 835 C390 905 365 942 330 1000" stroke="#20221e" stroke-width="26"/>

  <rect class="note" x="82" y="300" width="395" height="132"/>
  <text x="112" y="355" class="jp" font-size="34" font-weight="700" fill="#263225">湿った土と</text>
  <text x="112" y="400" class="jp" font-size="34" font-weight="700" fill="#263225">水辺にすむ</text>

  <rect class="note" x="725" y="285" width="390" height="142"/>
  <text x="755" y="342" class="jp" font-size="32" font-weight="700" fill="#263225">22本の星で</text>
  <text x="755" y="389" class="jp" font-size="32" font-weight="700" fill="#263225">泥をさわる</text>

  <rect class="note" x="120" y="1050" width="520" height="144"/>
  <text x="152" y="1108" class="jp" font-size="32" font-weight="700" fill="#263225">泡で水中のにおいを</text>
  <text x="152" y="1155" class="jp" font-size="32" font-weight="700" fill="#263225">たどる</text>

  <rect x="82" y="1354" width="1036" height="72" rx="18" fill="#efe3c1" stroke="#58634f" stroke-width="3"/>
  <text x="112" y="1402" class="jp" font-size="27" fill="#3e4738">IUCN Red List: Least Concern (2016)。湿った土と水辺が、この暮らしの舞台。</text>
</svg>
