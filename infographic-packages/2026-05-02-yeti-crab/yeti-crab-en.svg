    <path d="M605 520 C700 495 775 455 845 405" fill="none" stroke="#f7f4e9" stroke-width="44" stroke-linecap="round"/>
    <path d="M310 575 C245 645 175 690 100 710" fill="none" stroke="#f7f4e9" stroke-width="35" stroke-linecap="round"/>
    <path d="M630 575 C705 640 785 675 865 690" fill="none" stroke="#f7f4e9" stroke-width="35" stroke-linecap="round"/>
    <g stroke="#d9c78f" stroke-width="7" stroke-linecap="round">
      <path d="M135 425 l-34 -34"/><path d="M160 440 l-42 -8"/><path d="M190 455 l-40 20"/><path d="M218 470 l-30 38"/>
