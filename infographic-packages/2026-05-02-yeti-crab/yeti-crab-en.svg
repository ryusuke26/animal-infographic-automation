    <circle cx="390" cy="485" r="10" fill="#33312c"/>
    <circle cx="548" cy="485" r="10" fill="#33312c"/>
    <path d="M410 600 C450 628 500 628 540 600" fill="none" stroke="#6a6252" stroke-width="7" stroke-linecap="round"/>
    <text x="30" y="80" font-family="Trebuchet MS, Arial, sans-serif" font-size="34" fill="#2f4b5a">Deep hydrothermal vents</text>
    <text x="30" y="122" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" fill="#6f6657">dark seafloor around 2,200 m</text>
  </g>
  <g font-family="Trebuchet MS, Arial, sans-serif" fill="#2b2a26">
    <rect x="92" y="1050" width="1016" height="76" rx="24" fill="#fff8e8" stroke="#d5c39b" stroke-width="4"/>
    <text x="130" y="1100" font-size="34">1. Found at deep vents far below sunlight.</text>
    <rect x="92" y="1150" width="1016" height="76" rx="24" fill="#fff8e8" stroke="#d5c39b" stroke-width="4"/>
    <text x="130" y="1200" font-size="34">2. Hair-like setae carry dense bacteria.</text>
    <rect x="92" y="1250" width="1016" height="76" rx="24" fill="#fff8e8" stroke="#d5c39b" stroke-width="4"/>
    <text x="130" y="1300" font-size="34">3. Reduced eyes fit a dark seafloor life.</text>
    <text x="600" y="1408" text-anchor="middle" font-size="28" fill="#5a554b">IUCN Red List: Not Evaluated (NE, SeaLifeBase 2025-2)</text>
  </g>
