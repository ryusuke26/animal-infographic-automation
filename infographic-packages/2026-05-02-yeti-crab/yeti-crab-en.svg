<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Field-notebook infographic about the Yeti crab Kiwa hirsuta</title>
  <desc id="desc">A pale Yeti crab beside a deep-sea hydrothermal vent, with fuzzy setae and bacterial dots, plus short English observation notes.</desc>
  <rect width="1200" height="1500" fill="#f4ead5"/>
  <g opacity="0.35">
    <path d="M0 80 C250 20 440 130 650 70 S1000 20 1200 90" fill="none" stroke="#d8c8a9" stroke-width="18"/>
    <path d="M0 1390 C250 1450 420 1340 650 1410 S980 1480 1200 1390" fill="none" stroke="#d8c8a9" stroke-width="18"/>
  </g>
  <text x="600" y="130" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="88" font-weight="700" fill="#2b2a26">Yeti crab</text>
  <text x="600" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-style="italic" fill="#4e4a40">Kiwa hirsuta</text>
  <g transform="translate(120 280)">
