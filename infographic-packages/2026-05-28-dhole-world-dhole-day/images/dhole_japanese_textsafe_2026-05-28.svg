  <text x="82" y="425" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="27" fill="#3d392f">赤褐色の体と</text>
  <text x="82" y="462" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="27" fill="#3d392f">黒っぽい尾の先</text>
