  <text x="818" y="435" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="27" fill="#3d392f">口笛のような声で</text>
  <text x="818" y="472" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="27" fill="#3d392f">仲間に合図する</text>
