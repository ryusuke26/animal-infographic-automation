  <text x="94" y="1015" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="27" fill="#3d392f">家族の群れで</text>
  <text x="94" y="1052" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="27" fill="#3d392f">森の道を動く</text>
  <text x="66" y="1270" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="34" font-weight="700" fill="#454039">まだ知らない森の声に出会う、</text>
