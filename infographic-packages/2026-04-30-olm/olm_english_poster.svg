<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">The Olm of Underground Water</title>
  <desc id="desc">Curiosity-first English infographic about the olm, Proteus anguinus.</desc>
  <rect width="1600" height="2000" fill="#f4ead8"/>
  <rect x="88" y="88" width="1424" height="1824" rx="44" fill="#f8f0e2" stroke="#5a6f73" stroke-width="8"/>
