  <circle cx="1064" cy="1008" r="8" fill="#7f6b6b"/>
  <g font-family="Trebuchet MS, Arial, sans-serif" font-size="44" fill="#26393c">
    <text x="170" y="525">Lives in dark</text>
    <text x="170" y="582">karst groundwater</text>
    <text x="948" y="520">Skin-covered eyes;</text>
    <text x="948" y="577">senses guide it</text>
    <text x="948" y="634">through the water</text>
    <text x="258" y="1548">Keeps feathery</text>
    <text x="258" y="1605">external gills</text>
    <text x="258" y="1662">as an adult</text>
  </g>
