  <text x="800" y="1808" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="36" fill="#26393c">IUCN Red List: Vulnerable (VU)。地下水のよごれや環境変化に弱いとされる。</text>
