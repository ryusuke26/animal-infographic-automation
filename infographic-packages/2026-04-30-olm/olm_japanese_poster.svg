  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="44" fill="#26393c">
    <text x="170" y="525">光のないカルストの</text>
    <text x="170" y="582">地下水にすむ</text>
    <text x="980" y="520">目は皮ふにおおわれ、</text>
    <text x="980" y="577">暗い水を感覚で読む</text>
    <text x="258" y="1548">羽みたいな外えらを</text>
    <text x="258" y="1605">大人になってももつ</text>
  </g>
